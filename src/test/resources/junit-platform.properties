# Configuración usada cuando los .feature se ejecutan directamente desde IntelliJ
# (plugin Cucumber for Java) o desde el motor de JUnit Platform.
cucumber.glue=steps_definitions
cucumber.plugin=pretty, html:build/reports/cucumber/cucumber.html, json:build/reports/cucumber/cucumber.json
cucumber.publish.quiet=true
cucumber.junit-platform.naming-strategy=long

# Ejecución en paralelo (un navegador por hilo gracias a ThreadLocal en PlaywrightManager).
# Descomentar para habilitarla:
#cucumber.execution.parallel.enabled=true
#cucumber.execution.parallel.config.strategy=fixed
#cucumber.execution.parallel.config.fixed.parallelism=2
