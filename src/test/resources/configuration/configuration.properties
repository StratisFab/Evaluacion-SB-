# ---------------------------------------------------------------
# Configuración del framework. Cualquier valor puede sobrescribirse
# por línea de comandos con -Dclave=valor, por ejemplo:
#   gradlew test -Dheadless=true -Dbrowser=firefox
# ---------------------------------------------------------------

# URL de la aplicación bajo prueba
baseUrl=https://www.americanexpress.com/en-us/travel/flights

# Navegador: chromium | firefox | webkit
browser=chromium

# Canal del navegador instalado en el equipo (vacío = Chromium de Playwright). Ej.: chrome, msedge
channel=

# true = sin interfaz gráfica (CI); false = navegador visible.
# Si existe la variable de entorno CI se fuerza headless salvo que se indique -Dheadless.
headless=false

# User agent del navegador. Vacío = el del navegador; en headless se sustituye por uno sin "HeadlessChrome",
# porque el sitio (Akamai) responde "Access Denied" al user agent headless.
userAgent=

# Retardo en ms entre acciones de Playwright (0 = sin retardo). Útil para depurar.
slowMo=0

# Timeout por defecto (ms) para acciones/esperas y para navegaciones
timeout=30000
navigationTimeout=60000

# Tamaño de la ventana del navegador
viewportWidth=1366
viewportHeight=768

# Bloquear imágenes, fuentes y video para acelerar la carga (no afectan la prueba funcional)
blockMedia=false

# Trace de Playwright (se abre con: gradlew playwright --args="show-trace build/traces/<archivo>.zip")
#   off | on-failure | always
traceMode=on-failure

# Datos de fechas: la salida será "hoy + departureOffsetDays" y el regreso
# "salida + tripLengthDays". Así el escenario nunca depende de una fecha fija.
departureOffsetDays=10
tripLengthDays=5

# Carpetas de evidencias
screenshotsDir=build/screenshots
tracesDir=build/traces
